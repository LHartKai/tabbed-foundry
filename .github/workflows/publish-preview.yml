name: Publish Tabbed Foundry Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tabbed-foundry-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.event.head_commit.message, 'preview-release:')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate module source
        run: |
          node --check scripts/tabbed-foundry.js
          node tests/smoke.js
          node - <<'NODE'
          const fs = require("fs");
          const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
          if (m.id !== "tabbed-foundry") throw new Error("Invalid module id");
          if (!/-beta\./.test(m.version)) throw new Error("Preview workflow requires a beta version");
          if (!m.relationships?.requires?.some(r => r.id === "lib-wrapper")) throw new Error("libWrapper dependency is missing");
          if (m.download !== `https://github.com/${process.env.GITHUB_REPOSITORY}/releases/download/v${m.version}/tabbed-foundry.zip`) {
            throw new Error("Manifest download URL does not match the beta version");
          }
          console.log(`Validated ${m.id} ${m.version}`);
          NODE

      - name: Package Foundry module
        run: |
          mkdir -p dist/tabbed-foundry
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' --exclude='tests' --exclude='.gitignore' ./ dist/tabbed-foundry/
          cd dist
          zip -r "../tabbed-foundry.zip" tabbed-foundry
          cd ..
          cp module.json release-module.json

      - name: Create prerelease tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          TAG="v$(node -p "require('./module.json').version")"
          git fetch --tags --force
          if ! git rev-parse "$TAG" >/dev/null 2>&1; then
            git tag -a "$TAG" -m "Preview release $TAG"
            git push origin "$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its published assets unchanged."
          else
            gh release create "$TAG" \
              "tabbed-foundry.zip" \
              "release-module.json#module.json" \
              --title "Tabbed Foundry $TAG" \
              --notes "Prévia de desenvolvimento do Tabbed Foundry. Validar no Foundry Desktop v14.365 antes de utilizar em mundos de produção." \
              --prerelease
          fi

          echo "Preview: https://github.com/$REPOSITORY/releases/tag/$TAG"
