name: Create Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Tipo de incremento da versão"
        required: true
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      prerelease:
        description: "Criar uma pré-release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Bump version, tag and publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Calculate next version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          git fetch --tags --force

          CURRENT=$(node -p "require('./module.json').version")
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1)
          if [ -n "$LATEST_TAG" ]; then
            CURRENT="${LATEST_TAG#v}"
          fi

          node - "$CURRENT" "$BUMP" "$PRERELEASE" <<'NODE'
          const fs = require("fs");
          const [current, bump, prerelease] = process.argv.slice(2);
          const match = current.match(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-([0-9A-Za-z.-]+))?$/);
          if (!match) throw new Error(`Invalid semantic version: ${current}`);

          let [, major, minor, patch] = match;
          major = Number(major);
          minor = Number(minor);
          patch = Number(patch);

          if (bump === "major") { major++; minor = 0; patch = 0; }
          else if (bump === "minor") { minor++; patch = 0; }
          else { patch++; }

          let next = `${major}.${minor}.${patch}`;
          if (prerelease === "true") next += "-beta.1";

          const manifest = JSON.parse(fs.readFileSync("module.json", "utf8"));
          manifest.version = next;
          fs.writeFileSync("module.json", JSON.stringify(manifest, null, 2) + "\n");

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${next}\ntag=v${next}\n`);
          NODE

      - name: Commit version update when needed
        run: |
          git add module.json
          if git diff --cached --quiet; then
            echo "module.json already has version ${{ steps.version.outputs.version }}; skipping commit."
          else
            git commit -m "chore(release): v${{ steps.version.outputs.version }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Create and push version tag
        run: |
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Validate module source
        run: |
          node --check scripts/tabbed-foundry.js
          node -e "const m = JSON.parse(require('fs').readFileSync('module.json', 'utf8')); if (m.id !== 'tabbed-foundry') process.exit(1);"
          test -f styles/tabbed-foundry.css
          test -f templates/host.hbs

      - name: Package Foundry module
        run: |
          mkdir -p dist/tabbed-foundry
          rsync -a --exclude='.git' --exclude='.github' --exclude='dist' ./ dist/tabbed-foundry/
          cd dist
          zip -r "../tabbed-foundry.zip" tabbed-foundry
          cd ..
          cp module.json release-module.json

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          NOTES_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            NOTES_ARGS+=(--prerelease)
          fi

          gh release create "$TAG" \
            "tabbed-foundry.zip" \
            "release-module.json#module.json" \
            --title "Tabbed Foundry $TAG" \
            --generate-notes \
            "${NOTES_ARGS[@]}"

      - name: Report release
        run: |
          echo "Published Tabbed Foundry ${{ steps.version.outputs.version }}"
          echo "Manifest: https://github.com/${{ github.repository }}/releases/latest/download/module.json"
          echo "Download: https://github.com/${{ github.repository }}/releases/latest/download/tabbed-foundry.zip"
